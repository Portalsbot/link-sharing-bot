[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "link-sharing-bot"
version = "0.1.0"
description = "Private, independently deployable Telegram bot project scaffold"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]==22.8",
  "asyncpg>=0.30,<1",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
